name: CI

# Branch protection (repo Settings → Branches → main): require the
# `ci-required` check plus every gate job (typecheck, lint, audit, migrate,
# vitest, playwright, gitleaks) so a deliberately failing commit cannot merge.
# All jobs are fail-closed: no continue-on-error, no shell bypasses.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: focusflow
          POSTGRES_PASSWORD: focusflow
          POSTGRES_DB: focusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusflow -d focusflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://focusflow:focusflow@localhost:5432/focusflow
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma generate
      - run: pnpm test

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  migrate:
    name: migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: focusflow
          POSTGRES_PASSWORD: focusflow
          POSTGRES_DB: focusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusflow -d focusflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://focusflow:focusflow@localhost:5432/focusflow
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma migrate status

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    needs: [migrate, vitest]
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: focusflow
          POSTGRES_PASSWORD: focusflow
          POSTGRES_DB: focusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focusflow -d focusflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://focusflow:focusflow@localhost:5432/focusflow
      AUTH_SECRET: ci-only-placeholder-secret-min-32-chars-long
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Personal repo: no GITLEAKS_LICENSE needed (org repos require one,
          # free at gitleaks.io — add as a secret if this ever moves to an org).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [typecheck, lint, audit, migrate, vitest, playwright, gitleaks]
    steps:
      - run: echo "All CI gates passed."
